<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub - Czat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Navbar na czacie -->
    <header class="navbar">
        <div class="nav-left">
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">⬅ Wróć</button>
        </div>
        <div class="nav-center">
            <div class="avatar" id="room-avatar">#</div>
            <div>
                <div class="nav-title" id="current-room-title">Czat</div>
                <div class="nav-subtitle">Zaszyfrowany pokój</div>
            </div>
        </div>
        <div class="nav-right" style="justify-content: flex-end;">
            <button class="nav-btn" onclick="openSettings()">⚙️</button>
        </div>
    </header>

    <div class="chat-container">
        <div id="chat-messages" class="chat-messages">
            <!-- Wiadomości -->
        </div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <!-- Pasek pisania z przyciskiem plusa -->
        <div class="chat-input-bar">
            <div class="attach-container">
                <button class="attach-btn" onclick="toggleAttachMenu()" title="Więcej opcji">+</button>
                <!-- Rozwijane menu pod plusem -->
                <div id="attach-menu" class="attach-menu">
                    <div class="attach-menu-item" onclick="promptProposeTime()">⏰ Zaproponuj godzinę</div>
                    <div class="attach-menu-item" onclick="promptProposeMatch()">⚽ Wyślij miejsce i godzinę gry</div>
                </div>
            </div>

            <input type="text" id="message-input" placeholder="Napisz wiadomość..." oninput="notifyTyping()" onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <!-- Modal Ustawień -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3>Ustawienia konta</h3>
            <div class="avatar-preview" id="modal-avatar-preview">U</div>
            
            <div class="input-group" style="text-align: left;">
                <label>Wybierz zdjęcie profilowe</label>
                <input type="file" id="avatar-file-input" accept="image/*" onchange="previewAndCompressImage(event)" style="color: var(--text-main);">
            </div>

            <button onclick="saveSettings()" style="margin-bottom: 10px;">Zapisz zmiany</button>
            <button class="btn-decline" onclick="logout()" style="width:100%; padding:12px; border-radius:6px; border:none; font-weight:bold; cursor:pointer;">Wyloguj się</button>
            <button onclick="closeSettings()" style="background:transparent; color:var(--text-muted); margin-top:10px; border:none; cursor:pointer;">Zamknij</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let chatChannel = null;
        let typingTimeout = null;
        let compressedAvatarBase64 = null;

        const currentUser = getCurrentUser();
        const roomIdRaw = localStorage.getItem('current_room_id');
        const roomId = roomIdRaw ? parseInt(roomIdRaw, 10) : null;
        const roomName = localStorage.getItem('current_room_name') || 'Czat';

        if (!currentUser || !roomId || isNaN(roomId)) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('current-room-title').textContent = '#' + roomName;
            document.getElementById('room-avatar').textContent = roomName.charAt(0).toUpperCase();
            loadMessages();
            setupRealtime();
        }

        // Zamykanie menu po kliknięciu poza nim
        window.addEventListener('click', function(e) {
            if (!e.target.closest('.attach-container')) {
                document.getElementById('attach-menu').classList.remove('active');
            }
        });

        function toggleAttachMenu() {
            document.getElementById('attach-menu').classList.toggle('active');
        }

        // Funkcje dodatkowe z menu plusa
        function promptProposeTime() {
            toggleAttachMenu();
            const time = prompt("Podaj proponowaną godzinę (np. 18:30):");
            if (time) {
                sendSpecialMessage(`⏰ **Propozycja godziny:** ${time}`);
            }
        }

        function promptProposeMatch() {
            toggleAttachMenu();
            const location = prompt("Podaj miejsce (np. Boisko szkolne / Orlik):");
            if (!location) return;
            const time = prompt("Podaj godzinę meczu (np. 17:00):");
            if (!time) return;

            sendSpecialMessage(`⚽ **Ustalenia gry:**\n📍 Miejsce: ${location}\n🕒 Godzina: ${time}`);
        }

        async function sendSpecialMessage(formattedText) {
            const { data, error } = await supabaseClient.from('messages').insert([{
                room_id: roomId,
                sender: currentUser.username,
                content: formattedText
            }]).select();

            if (!error && data && data.length > 0) {
                const newMsg = data[0];
                appendMessageUI(newMsg);
                if (chatChannel) {
                    chatChannel.send({
                        type: 'broadcast',
                        event: 'new_message',
                        payload: { message: newMsg }
                    });
                }
            }
        }

        // Pobieranie 50 ostatnich wiadomości
        async function loadMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 20px;">Ładowanie najnowszych wiadomości...</div>`;
            
            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('room_id', roomId)
                .order('created_at', { ascending: false })
                .limit(50);

            if (error) {
                container.innerHTML = `<div style="color: #ff5555; padding: 20px; text-align: center;">Błąd bazy danych: ${error.message}</div>`;
                return;
            }

            container.innerHTML = '';
            if (messages && messages.length > 0) {
                messages.reverse().forEach(msg => appendMessageUI(msg));
            } else {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 40px;">Brak wiadomości w tym pokoju. Napisz coś jako pierwszy!</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageUI(msg) {
            const container = document.getElementById('chat-messages');
            
            if (container.innerHTML.includes('Brak wiadomości') || container.innerHTML.includes('Ładowanie najnowszych')) {
                container.innerHTML = '';
            }

            const isMine = msg.sender === currentUser.username;
            const firstLetter = msg.sender.charAt(0).toUpperCase();
            
            // Konwersja prostych enterów na nową linię
            const formattedContent = escapeHtml(msg.content).replace(/\n/g, '<br>');
            
            container.innerHTML += `
                <div class="message ${isMine ? 'mine' : ''}">
                    <div class="avatar avatar-sm">${firstLetter}</div>
                    <div class="message-content">
                        <div class="sender">${escapeHtml(msg.sender)}</div>
                        <div class="text">${formattedContent}</div>
                        <div class="meta">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function setupRealtime() {
            if (chatChannel) {
                supabaseClient.removeChannel(chatChannel);
            }

            chatChannel = supabaseClient.channel('room-rt-' + roomId);

            chatChannel.on('broadcast', { event: 'new_message' }, payload => {
                if (payload.payload && payload.payload.message) {
                    if (payload.payload.message.sender !== currentUser.username) {
                        appendMessageUI(payload.payload.message);
                    }
                }
            });

            chatChannel.on('broadcast', { event: 'typing' }, payload => {
                const typingEl = document.getElementById('typing-indicator');
                if (payload.payload.username !== currentUser.username) {
                    typingEl.textContent = `${payload.payload.username} pisze...`;
                    clearTimeout(window.typingTimer);
                    window.typingTimer = setTimeout(() => {
                        typingEl.textContent = '';
                    }, 2000);
                }
            });

            chatChannel.subscribe();
        }

        function notifyTyping() {
            if (!chatChannel) return;
            chatChannel.send({
                type: 'broadcast',
                event: 'typing',
                payload: { username: currentUser.username }
            });
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const { data, error } = await supabaseClient.from('messages').insert([{
                room_id: roomId,
                sender: currentUser.username,
                content: text
            }]).select();

            if (error) {
                alert("Nie udało się wysłać wiadomości: " + error.message);
            } else {
                input.value = '';

                if (data && data.length > 0) {
                    const newMsg = data[0];
                    appendMessageUI(newMsg);

                    if (chatChannel) {
                        chatChannel.send({
                            type: 'broadcast',
                            event: 'new_message',
                            payload: { message: newMsg }
                        });
                    }
                }
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function openSettings() {
            compressedAvatarBase64 = currentUser.avatar || null;
            const preview = document.getElementById('modal-avatar-preview');
            if (compressedAvatarBase64) {
                preview.innerHTML = `<img src="${compressedAvatarBase64}" alt="Preview">`;
            } else {
                preview.textContent = currentUser.username.charAt(0).toUpperCase();
            }
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function previewAndCompressImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 120;
                    const MAX_HEIGHT = 120;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedAvatarBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('modal-avatar-preview').innerHTML = `<img src="${compressedAvatarBase64}" alt="Preview">`;
                }
            }
        }

        async function saveSettings() {
            const updateData = {};
            if (compressedAvatarBase64 !== null) {
                updateData.avatar = compressedAvatarBase64;
            }
            
            const { error } = await supabaseClient
                .from('users')
                .update(updateData)
                .eq('id', currentUser.id);

            if (error) {
                alert('Błąd zapisu ustawień: ' + error.message);
            } else {
                if (compressedAvatarBase64 !== null) currentUser.avatar = compressedAvatarBase64;
                setCurrentUser(currentUser);
                alert('Zapisano ustawienia!');
                closeSettings();
            }
        }
    </script>
</body>
</html>
