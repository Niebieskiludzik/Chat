<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub - Czat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">⬅ Wróć</button>
        </div>
        <div class="nav-center">
            <div class="avatar" id="room-avatar">#</div>
            <div>
                <div class="nav-title" id="current-room-title">Czat</div>
                <div class="nav-subtitle" id="room-admin-status">Zaszyfrowany pokój</div>
            </div>
        </div>
        <div class="nav-right" style="justify-content: flex-end;">
            <button class="nav-btn" onclick="openChatSettings()">⚙️</button>
        </div>
    </header>

    <div class="chat-container">
        <div id="chat-messages" class="chat-messages">
            <!-- Wiadomości -->
        </div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <div class="chat-input-bar">
            <input type="text" id="message-input" placeholder="Napisz wiadomość..." oninput="notifyTyping()" onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <!-- Modal Ustawień Chatu (Motyw, Awatar pokoju, Członkowie) -->
    <div id="chat-settings-modal" class="modal">
        <div class="modal-content">
            <h3>Ustawienia Pokoju</h3>
            
            <!-- Sekcja Admina (Zmiana awatara i motywu grupy) -->
            <div id="admin-room-settings" style="display:none; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                <div class="avatar-preview avatar avatar-lg" id="modal-room-avatar-edit">#</div>
                <div class="input-group">
                    <label>Zmień zdjęcie grupy</label>
                    <input type="file" id="room-avatar-update-input" accept="image/*" onchange="updateRoomAvatar(event)" style="color: var(--text-main);">
                </div>
                <div class="input-group">
                    <label>Motyw kolorystyczny chatu</label>
                    <select id="room-theme-select" onchange="changeRoomTheme(this.value)">
                        <option value="gold">Złoty (Domyślny)</option>
                        <option value="emerald">Szmaragdowy (Zielony)</option>
                        <option value="crimson">Krwisty (Czerwony)</option>
                    </select>
                </div>
            </div>

            <p style="color:var(--text-muted); font-size:13px; margin-bottom:10px;">Członkowie pokoju:</p>
            <div id="members-list" style="margin-bottom: 20px; max-height: 180px; overflow-y: auto;">
                <!-- Lista członków -->
            </div>

            <div id="admin-controls" style="display:none; border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px;">
                <div class="input-group">
                    <label>Dodaj użytkownika do tego czatu</label>
                    <div style="display:flex; gap:10px;">
                        <select id="user-to-add-select" style="flex:1; padding:8px; background:var(--bg-color); color:var(--text-main); border:1px solid var(--border-color); border-radius:8px;">
                            <!-- Opcje -->
                        </select>
                        <button onclick="addUserToRoom()" style="width:auto; padding:8px 16px;">Dodaj</button>
                    </div>
                </div>
            </div>

            <button onclick="closeChatSettings()" style="background:transparent; color:var(--text-muted); margin-top:15px; border:none; cursor:pointer; width:100%;">Zamknij</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let chatChannel = null;
        let typingTimeout = null;
        let usersAvatarsMap = {};
        let isUserAdminInRoom = false;
        let currentRoomData = null;

        const currentUser = getCurrentUser();
        const roomIdRaw = localStorage.getItem('current_room_id');
        const roomId = roomIdRaw ? parseInt(roomIdRaw, 10) : null;
        const roomName = localStorage.getItem('current_room_name') || 'Czat';

        if (!currentUser || !roomId || isNaN(roomId)) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('current-room-title').textContent = '#' + roomName;
            
            loadRoomDetails().then(() => {
                checkAdminStatus().then(() => {
                    loadAllUsersAvatars().then(() => {
                        loadMessages();
                        setupRealtime();
                    });
                });
            });
        }

        async function loadRoomDetails() {
            const { data } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('id', roomId)
                .single();

            if (data) {
                currentRoomData = data;
                if (data.theme) {
                    applyRoomTheme(data.theme);
                }
                const avatarEl = document.getElementById('room-avatar');
                if (data.avatar) {
                    avatarEl.innerHTML = `<img src="${data.avatar}" alt="Room Avatar">`;
                } else {
                    avatarEl.textContent = roomName.charAt(0).toUpperCase();
                }
            }
        }

        function applyRoomTheme(themeName) {
            document.body.classList.remove('room-theme-emerald', 'room-theme-crimson');
            if (themeName !== 'gold') {
                document.body.classList.add(`room-theme-${themeName}`);
            }
        }

        async function changeRoomTheme(newTheme) {
            if (!isUserAdminInRoom) return;
            const { error } = await supabaseClient.from('rooms').update({ theme: newTheme }).eq('id', roomId);
            if (error) {
                showToast('Błąd zmiany motywu');
            } else {
                applyRoomTheme(newTheme);
                showToast('Zmieniono motyw pokoju!');
            }
        }

        async function updateRoomAvatar(event) {
            if (!isUserAdminInRoom) return;
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX = 150;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const base64Avatar = canvas.toDataURL('image/jpeg', 0.7);

                    const { error } = await supabaseClient.from('rooms').update({ avatar: base64Avatar }).eq('id', roomId);
                    if (error) {
                        showToast('Błąd aktualizacji zdjęcia grupy');
                    } else {
                        showToast('Zaktualizowano zdjęcie grupy!');
                        document.getElementById('room-avatar').innerHTML = `<img src="${base64Avatar}" alt="Room Avatar">`;
                        document.getElementById('modal-room-avatar-edit').innerHTML = `<img src="${base64Avatar}" alt="Preview">`;
                    }
                }
            }
        }

        async function checkAdminStatus() {
            const { data } = await supabaseClient
                .from('room_members')
                .select('is_admin')
                .eq('room_id', roomId)
                .eq('user_id', currentUser.id)
                .single();

            if (data && data.is_admin) {
                isUserAdminInRoom = true;
                document.getElementById('room-admin-status').textContent = 'Administrator pokoju';
            }
        }

        async function loadAllUsersAvatars() {
            const { data: users } = await supabaseClient.from('users').select('username, avatar, display_name');
            if (users) {
                users.forEach(u => {
                    usersAvatarsMap[u.username] = {
                        avatar: u.avatar,
                        displayName: u.display_name || u.username
                    };
                });
            }
        }

        let lastMessageDate = null;

        async function loadMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 20px;">Ładowanie najnowszych wiadomości...</div>`;
            
            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('room_id', roomId)
                .order('created_at', { ascending: false })
                .limit(50);

            if (error) {
                container.innerHTML = `<div style="color: #ff5555; padding: 20px; text-align: center;">Błąd bazy danych</div>`;
                return;
            }

            container.innerHTML = '';
            lastMessageDate = null;

            if (messages && messages.length > 0) {
                messages.reverse().forEach(msg => appendMessageUI(msg));
            } else {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 40px;">Brak wiadomości w tym pokoju. Napisz coś jako pierwszy!</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function getDateString(dateObj) {
            const today = new Date();
            if (dateObj.toDateString() === today.toDateString()) return 'Dzisiaj';
            
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);
            if (dateObj.toDateString() === yesterday.toDateString()) return 'Wczoraj';

            return dateObj.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function appendMessageUI(msg) {
            const container = document.getElementById('chat-messages');
            
            if (container.innerHTML.includes('Brak wiadomości') || container.innerHTML.includes('Ładowanie najnowszych')) {
                container.innerHTML = '';
            }

            const msgDate = new Date(msg.created_at);
            const dateStr = getDateString(msgDate);

            if (dateStr !== lastMessageDate) {
                lastMessageDate = dateStr;
                container.innerHTML += `
                    <div class="date-divider">
                        <span>${dateStr}</span>
                    </div>
                `;
            }

            const isMine = msg.sender === currentUser.username;
            const userInfo = usersAvatarsMap[msg.sender] || { avatar: null, displayName: msg.sender };
            const firstLetter = userInfo.displayName.charAt(0).toUpperCase();
            
            let avatarHtml = `<div class="avatar avatar-sm">${firstLetter}</div>`;
            if (userInfo.avatar) {
                avatarHtml = `<div class="avatar avatar-sm"><img src="${userInfo.avatar}" alt="Avatar"></div>`;
            }
            
            const timeStr = msgDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const formattedContent = escapeHtml(msg.content).replace(/\n/g, '<br>');
            
            container.innerHTML += `
                <div class="message ${isMine ? 'mine' : ''}">
                    ${!isMine ? avatarHtml : ''}
                    <div class="message-content">
                        <div class="sender">${escapeHtml(userInfo.displayName)}</div>
                        <div class="message-body">
                            <div class="text">${formattedContent}</div>
                            <div class="meta">${timeStr}</div>
                        </div>
                    </div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function setupRealtime() {
            if (chatChannel) supabaseClient.removeChannel(chatChannel);
            chatChannel = supabaseClient.channel('room-rt-' + roomId);

            chatChannel.on('broadcast', { event: 'new_message' }, payload => {
                if (payload.payload && payload.payload.message) {
                    if (payload.payload.message.sender !== currentUser.username) {
                        appendMessageUI(payload.payload.message);
                    }
                }
            });

            chatChannel.on('broadcast', { event: 'typing' }, payload => {
                const typingEl = document.getElementById('typing-indicator');
                if (payload.payload.username !== currentUser.username) {
                    typingEl.textContent = `${payload.payload.username} pisze...`;
                    clearTimeout(window.typingTimer);
                    window.typingTimer = setTimeout(() => { typingEl.textContent = ''; }, 2000);
                }
            });

            chatChannel.subscribe();
        }

        function notifyTyping() {
            if (!chatChannel) return;
            chatChannel.send({ type: 'broadcast', event: 'typing', payload: { username: currentUser.username } });
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const { data, error } = await supabaseClient.from('messages').insert([{
                room_id: roomId,
                sender: currentUser.username,
                content: text
            }]).select();

            if (error) {
                showToast("Nie udało się wysłać wiadomości");
            } else {
                input.value = '';
                if (data && data.length > 0) {
                    const newMsg = data[0];
                    appendMessageUI(newMsg);
                    if (chatChannel) {
                        chatChannel.send({ type: 'broadcast', event: 'new_message', payload: { message: newMsg } });
                    }
                }
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function openChatSettings() {
            document.getElementById('chat-settings-modal').classList.add('active');
            loadRoomMembers();
            
            if (isUserAdminInRoom) {
                document.getElementById('admin-controls').style.display = 'block';
                document.getElementById('admin-room-settings').style.display = 'block';
                loadAvailableUsersToAdd();

                const editAvatarPrev = document.getElementById('modal-room-avatar-edit');
                if (currentRoomData && currentRoomData.avatar) {
                    editAvatarPrev.innerHTML = `<img src="${currentRoomData.avatar}" alt="Room Avatar">`;
                } else {
                    editAvatarPrev.textContent = roomName.charAt(0).toUpperCase();
                }
                if (currentRoomData && currentRoomData.theme) {
                    document.getElementById('room-theme-select').value = currentRoomData.theme;
                }
            } else {
                document.getElementById('admin-controls').style.display = 'none';
                document.getElementById('admin-room-settings').style.display = 'none';
            }
        }

        function closeChatSettings() {
            document.getElementById('chat-settings-modal').classList.remove('active');
        }

        async function loadRoomMembers() {
            const { data: members } = await supabaseClient
                .from('room_members')
                .select('user_id, is_admin, users(username, display_name)')
                .eq('room_id', roomId);

            const listEl = document.getElementById('members-list');
            listEl.innerHTML = '';

            if (members) {
                members.forEach(m => {
                    const name = m.users.display_name || m.users.username;
                    const adminBadge = m.is_admin ? '<span style="color:var(--accent); font-size:10px; margin-left:6px;">[ADMIN]</span>' : '';
                    let actionButton = '';
                    if (isUserAdminInRoom && m.user_id !== currentUser.id) {
                        actionButton = `<button onclick="removeUserFromRoom(${m.user_id})" style="background:#333; color:#ff5555; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Usuń</button>`;
                    }

                    listEl.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border-color);">
                            <span>${escapeHtml(name)} (${m.users.username}) ${adminBadge}</span>
                            ${actionButton}
                        </div>
                    `;
                });
            }
        }

        async function loadAvailableUsersToAdd() {
            const { data: allUsers } = await supabaseClient.from('users').select('id, username, display_name');
            const { data: currentMembers } = await supabaseClient.from('room_members').select('user_id').eq('room_id', roomId);
            const memberIds = currentMembers ? currentMembers.map(m => m.user_id) : [];
            const selectEl = document.getElementById('user-to-add-select');
            selectEl.innerHTML = '';

            if (allUsers) {
                allUsers.forEach(u => {
                    if (!memberIds.includes(u.id)) {
                        selectEl.innerHTML += `<option value="${u.id}">${u.display_name || u.username} (${u.username})</option>`;
                    }
                });
            }
        }

        async function addUserToRoom() {
            if (!isUserAdminInRoom) return;
            const userId = document.getElementById('user-to-add-select').value;
            if (!userId) return;

            const { error } = await supabaseClient.from('room_members').insert([{ room_id: roomId, user_id: parseInt(userId, 10), is_admin: false }]);
            if (error) {
                showToast('Błąd dodawania użytkownika');
            } else {
                showToast('Dodano użytkownika');
                loadRoomMembers();
                loadAvailableUsersToAdd();
            }
        }

        async function removeUserFromRoom(userId) {
            if (!isUserAdminInRoom) return;
            const { error } = await supabaseClient.from('room_members').delete().eq('room_id', roomId).eq('user_id', userId);
            if (error) {
                showToast('Błąd usuwania użytkownika');
            } else {
                showToast('Usunięto użytkownika');
                loadRoomMembers();
                if (isUserAdminInRoom) loadAvailableUsersToAdd();
            }
        }
    </script>
</body>
</html>
