<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub - Czat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3 id="current-room-title" style="color: var(--gold);">Czat</h3>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Wróć do menu</button>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            <!-- Wiadomości -->
        </div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <div class="chat-input-bar">
            <input type="text" id="message-input" placeholder="Napisz wiadomość..." oninput="notifyTyping()" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const currentUser = getCurrentUser();
        const roomId = localStorage.getItem('current_room_id');
        const roomName = localStorage.getItem('current_room_name');

        if (!currentUser || !roomId) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('current-room-title').textContent = '#' + roomName;
            loadMessages();
            setupRealtime();
        }

        let typingTimeout = null;
