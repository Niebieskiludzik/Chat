<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub - Czat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Navbar na czacie -->
    <header class="navbar">
        <div class="nav-left">
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">⬅ Wróć</button>
        </div>
        <div class="nav-center">
            <div class="avatar" id="room-avatar">#</div>
            <div>
                <div class="nav-title" id="current-room-title">Czat</div>
                <div class="nav-subtitle">Zaszyfrowany pokój</div>
            </div>
        </div>
        <div class="nav-right" style="justify-content: flex-end;">
            <button class="nav-btn" onclick="openSettings()">⚙️</button>
        </div>
    </header>

    <div class="chat-container">
        <div id="chat-messages" class="chat-messages">
            <!-- Wiadomości -->
        </div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <div class="chat-input-bar">
            <input type="text" id="message-input" placeholder="Napisz wiadomość..." oninput="notifyTyping()" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <!-- Modal Ustawień -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3>Ustawienia konta</h3>
            <div class="input-group">
                <label>Link do Twojego avatara (URL obrazka)</label>
                <input type="text" id="setting-avatar-url" placeholder="https://example.com/avatar.jpg">
            </div>
            <button onclick="saveSettings()" style="margin-bottom: 10px;">Zapisz zmiany</button>
            <button class="btn-decline" onclick="logout()" style="width:100%; padding:12px; border-radius:6px; border:none; font-weight:bold; cursor:pointer;">Wyloguj się</button>
            <button onclick="closeSettings()" style="background:transparent; color:var(--text-muted); margin-top:10px;">Zamknij</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let chatChannel = null;
        let typingTimeout = null;

        const currentUser = getCurrentUser();
        const roomIdRaw = localStorage.getItem('current_room_id');
        const roomId = roomIdRaw ? parseInt(roomIdRaw, 10) : null;
        const roomName = localStorage.getItem('current_room_name') || 'Czat';

        if (!currentUser || !roomId || isNaN(roomId)) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('current-room-title').textContent = '#' + roomName;
            document.getElementById('room-avatar').textContent = roomName.charAt(0).toUpperCase();
            loadMessages();
            setupRealtime();
        }

        // OPTYMALIZACIJA: Pobieramy tylko ostatnich 50 wiadomości
        async function loadMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 20px;">Ładowanie najnowszych wiadomości...</div>`;
            
            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('room_id', roomId)
                .order('created_at', { ascending: false }) // Najpierw najnowsze
                .limit(50);                                 // Ograniczenie do 50 sztuk (optymalizacja)

            if (error) {
                container.innerHTML = `<div style="color: #ff5555; padding: 20px; text-align: center;">Błąd bazy danych: ${error.message}</div>`;
                return;
            }

            container.innerHTML = '';
            if (messages && messages.length > 0) {
                // Odwracamy tablicę, żeby najstarsze z tej 50 były na górze, a najnowsze na dole
                messages.reverse().forEach(msg => appendMessageUI(msg));
            } else {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 40px;">Brak wiadomości w tym pokoju. Napisz coś jako pierwszy!</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageUI(msg) {
            const container = document.getElementById('chat-messages');
            
            if (container.innerHTML.includes('Brak wiadomości') || container.innerHTML.includes('Ładowanie najnowszych')) {
                container.innerHTML = '';
            }

            const isMine = msg.sender === currentUser.username;
            const firstLetter = msg.sender.charAt(0).toUpperCase();
            
            container.innerHTML += `
                <div class="message ${isMine ? 'mine' : ''}">
                    <div class="avatar avatar-sm">${firstLetter}</div>
                    <div class="message-content">
                        <div class="sender">${escapeHtml(msg.sender)}</div>
                        <div class="text">${escapeHtml(msg.content)}</div>
                        <div class="meta">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function setupRealtime() {
            if (chatChannel) {
                supabaseClient.removeChannel(chatChannel);
            }

            chatChannel = supabaseClient.channel('room-rt-' + roomId);

            chatChannel.on('broadcast', { event: 'new_message' }, payload => {
                if (payload.payload && payload.payload.message) {
                    if (payload.payload.message.sender !== currentUser.username) {
                        appendMessageUI(payload.payload.message);
                    }
                }
            });

            chatChannel.on('broadcast', { event: 'typing' }, payload => {
                const typingEl = document.getElementById('typing-indicator');
                if (payload.payload.username !== currentUser.username) {
                    typingEl.textContent = `${payload.payload.username} pisze...`;
                    clearTimeout(window.typingTimer);
                    window.typingTimer = setTimeout(() => {
                        typingEl.textContent = '';
                    }, 2000);
                }
            });

            chatChannel.subscribe();
        }

        function notifyTyping() {
            if (!chatChannel) return;
            chatChannel.send({
                type: 'broadcast',
                event: 'typing',
                payload: { username: currentUser.username }
            });
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const { data, error } = await supabaseClient.from('messages').insert([{
                room_id: roomId,
                sender: currentUser.username,
                content: text
            }]).select();

            if (error) {
                alert("Nie udało się wysłać wiadomości: " + error.message);
            } else {
                input.value = '';

                if (data && data.length > 0) {
                    const newMsg = data[0];
                    appendMessageUI(newMsg);

                    if (chatChannel) {
                        chatChannel.send({
                            type: 'broadcast',
                            event: 'new_message',
                            payload: { message: newMsg }
                        });
                    }
                }
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function openSettings() {
            document.getElementById('setting-avatar-url').value = currentUser.avatar || '';
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        async function saveSettings() {
            const avatarUrl = document.getElementById('setting-avatar-url').value.trim();
            
            const { error } = await supabaseClient
                .from('users')
                .update({ avatar: avatarUrl })
                .eq('id', currentUser.id);

            if (error) {
                alert('Błąd zapisu ustawień: ' + error.message);
            } else {
                currentUser.avatar = avatarUrl;
                setCurrentUser(currentUser);
                alert('Zapisano ustawienia!');
                closeSettings();
            }
        }
    </script>
</body>
</html>
