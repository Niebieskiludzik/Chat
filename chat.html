<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub - Czat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3 id="current-room-title" style="color: var(--gold);">Czat</h3>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Wróć do menu</button>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            <!-- Wiadomości -->
        </div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <div class="chat-input-bar">
            <input type="text" id="message-input" placeholder="Napisz wiadomość..." oninput="notifyTyping()" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let chatChannel = null;
        let typingTimeout = null;

        const currentUser = getCurrentUser();
        // Pobieramy ID pokoju i konwertujemy na liczbę (INT), żeby baza danych go nie odrzuciła
        const roomIdRaw = localStorage.getItem('current_room_id');
        const roomId = roomIdRaw ? parseInt(roomIdRaw, 10) : null;
        const roomName = localStorage.getItem('current_room_name');

        console.log("Zalogowany użytkownik:", currentUser);
        console.log("Aktualny pokój ID:", roomId, "Nazwa:", roomName);

        if (!currentUser || !roomId || isNaN(roomId)) {
            console.error("Brak danych użytkownika lub pokoju! Przekierowanie do logowania.");
            window.location.href = 'index.html';
        } else {
            document.getElementById('current-room-title').textContent = '#' + (roomName || 'Czat');
            loadMessages();
            setupRealtime();
        }

        async function loadMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 20px;">Ładowanie wiadomości...</div>`;
            
            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('room_id', roomId)
                .order('created_at', { ascending: true });

            console.log("Pobrane wiadomości z bazy:", messages, "Błąd:", error);

            if (error) {
                container.innerHTML = `<div style="color: #ff5555; padding: 20px; text-align: center;">Błąd bazy danych: ${error.message}</div>`;
                return;
            }

            container.innerHTML = '';
            if (messages && messages.length > 0) {
                messages.forEach(msg => appendMessageUI(msg));
            } else {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 40px;">Brak wiadomości w tym pokoju. Napisz coś jako pierwszy!</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageUI(msg) {
            const container = document.getElementById('chat-messages');
            
            if (container.innerHTML.includes('Brak wiadomości') || container.innerHTML.includes('Ładowanie wiadomości')) {
                container.innerHTML = '';
            }

            const isMine = msg.sender === currentUser.username;
            
            container.innerHTML += `
                <div class="message ${isMine ? 'mine' : ''}">
                    <div class="sender">${escapeHtml(msg.sender)}</div>
                    <div class="text">${escapeHtml(msg.content)}</div>
                    <div class="meta">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function setupRealtime() {
            if (chatChannel) {
                supabaseClient.removeChannel(chatChannel);
            }

            chatChannel = supabaseClient.channel('room-rt-' + roomId);

            chatChannel.on('broadcast', { event: 'new_message' }, payload => {
                console.log("Odebrano impuls nowej wiadomości:", payload);
                if (payload.payload && payload.payload.message) {
                    if (payload.payload.message.sender !== currentUser.username) {
                        appendMessageUI(payload.payload.message);
                    }
                }
            });

            chatChannel.on('broadcast', { event: 'typing' }, payload => {
                const typingEl = document.getElementById('typing-indicator');
                if (payload.payload.username !== currentUser.username) {
                    typingEl.textContent = `${payload.payload.username} pisze...`;
                    clearTimeout(window.typingTimer);
                    window.typingTimer = setTimeout(() => {
                        typingEl.textContent = '';
                    }, 2000);
                }
            });

            chatChannel.subscribe((status) => {
                console.log("Status połączenia Realtime:", status);
            });
        }

        function notifyTyping() {
            if (!chatChannel) return;
            chatChannel.send({
                type: 'broadcast',
                event: 'typing',
                payload: { username: currentUser.username }
            });
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            console.log("Wysyłanie wiadomości...", { room_id: roomId, sender: currentUser.username, content: text });

            const { data, error } = await supabaseClient.from('messages').insert([{
                room_id: roomId,
                sender: currentUser.username,
                content: text
            }]).select();

            if (error) {
                console.error("Błąd wysyłania:", error);
                alert("Nie udało się wysłać wiadomości: " + error.message);
            } else {
                input.value = '';

                if (data && data.length > 0) {
                    const newMsg = data[0];
                    appendMessageUI(newMsg);

                    if (chatChannel) {
                        chatChannel.send({
                            type: 'broadcast',
                            event: 'new_message',
                            payload: { message: newMsg }
                        });
                    }
                }
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
