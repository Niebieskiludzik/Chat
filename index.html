<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub & Chat</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #141414;
            --border-color: #262626;
            --gold: #d4af37;
            --gold-hover: #f3c653;
            --text-main: #f5f5f5;
            --text-muted: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Widoki aplikacji */
        .view { display: none; width: 100%; height: 100vh; flex-direction: column; }
        .view.active { display: flex; }

        /* Ekran logowania */
        #login-view { justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .login-card h2 { color: var(--gold); margin-bottom: 24px; text-align: center; letter-spacing: 1px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 15px; }
        .input-group input:focus { border-color: var(--gold); outline: none; }
        
        button { background: var(--gold); color: #000; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--gold-hover); }

        /* Pasek propozycji na górze */
        .top-proposal-bar { background: linear-gradient(90deg, #1f1908, #141414); border-bottom: 1px solid var(--gold); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .proposal-info { font-size: 14px; color: var(--text-main); }
        .proposal-info span { color: var(--gold); font-weight: bold; }
        .proposal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .proposal-actions button { width: auto; padding: 6px 14px; font-size: 13px; margin: 0; }
        .btn-decline { background: #333; color: #ff5555; }
        .btn-decline:hover { background: #444; }

        /* Pasek informacji o urządzeniu */
        .device-badge { background: #1a1a1a; border: 1px solid var(--border-color); color: var(--gold); padding: 4px 10px; border-radius: 20px; font-size: 11px; display: inline-block; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Panel główny / Dashboard */
        .dashboard-container { max-width: 900px; width: 100%; margin: 30px auto; padding: 0 20px; flex: 1; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .section-title { font-size: 20px; color: var(--gold); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 16px; }
        
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .room-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .room-card:hover { border-color: var(--gold); transform: translateY(-2px); }
        .room-card h3 { font-size: 16px; margin-bottom: 6px; color: var(--text-main); }
        .room-card p { font-size: 13px; color: var(--text-muted); }

        /* Panel Admina */
        .admin-panel { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-top: 20px; }
        .admin-panel h3 { color: var(--gold); margin-bottom: 12px; font-size: 16px; }
        .admin-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .admin-row input { flex: 1; min-width: 150px; padding: 8px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }
        .admin-row button { width: auto; padding: 8px 16px; }

        /* Sekcja tworzenia propozycji (dla każdego lub admina) */
        .proposal-creator { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-top: 20px; }
        .proposal-creator h3 { color: var(--gold); margin-bottom: 12px; font-size: 16px; }

        /* Widok Czatu */
        .chat-container { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; width: 100%; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .chat-header { background: var(--card-bg); padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: transparent; color: var(--gold); border: 1px solid var(--gold); width: auto; padding: 6px 12px; font-size: 13px; }
        .back-btn:hover { background: var(--gold); color: #000; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0b0b0b; }
        .message { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 8px; max-width: 75%; position: relative; }
        .message.mine { align-self: flex-end; border-color: #332b0e; background: #121008; }
        .message .sender { font-size: 12px; color: var(--gold); margin-bottom: 4px; font-weight: bold; }
        .message .text { font-size: 14px; word-break: break-word; }
        .message .meta { font-size: 10px; color: var(--text-muted); text-align: right; margin-top: 4px; }

        .chat-input-bar { background: var(--card-bg); padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .chat-input-bar input { flex: 1; padding: 12px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }
        .chat-input-bar button { width: 100px; }

        /* Dopasowanie responsywne dla telefonów */
        @media (max-width: 600px) {
            .login-card { padding: 20px; }
            .top-proposal-bar { flex-direction: column; align-items: flex-start; }
            .proposal-actions { width: 100%; justify-content: space-between; }
            .proposal-actions button { flex: 1; text-align: center; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body class="device-desktop">

    <!-- 1. WIDOK LOGOWANIA -->
    <div id="login-view" class="view active">
        <div class="login-card">
            <h2>PRIVATE HUB</h2>
            <div style="text-align: center;">
                <div id="login-device-badge" class="device-badge">Wykrywanie urządzenia...</div>
            </div>
            <div class="input-group">
                <label>Login</label>
                <input type="text" id="login-username" placeholder="Wpisz swój login">
            </div>
            <div class="input-group">
                <label>Hasło</label>
                <input type="password" id="login-password" placeholder="Wpisz hasło">
            </div>
            <button onclick="handleLogin()">Zaloguj się</button>
        </div>
    </div>

    <!-- 2. WIDOK GŁÓWNY (DASHBOARD) -->
    <div id="dashboard-view" class="view">
        <!-- Harmonogram / Propozycja na boisko na samej górze -->
        <div id="proposal-bar" class="top-proposal-bar" style="display:none;">
            <div class="proposal-info">
                ⚽ <span id="proposal-title">Ładowanie...</span> (Autor: <span id="proposal-author">...</span>)
                <div id="proposal-summary" style="font-size: 11px; color: var(--text-muted); margin-top: 3px;">Odpowiedzi: brak</div>
            </div>
            <div class="proposal-actions">
                <button onclick="respondProposal('Będę')">Będę</button>
                <button onclick="openTimePrompt()">Inna godzina</button>
                <button class="btn-decline" onclick="respondProposal('Nie dam rady')">Nie dam rady</button>
            </div>
        </div>

        <div class="dashboard-container">
            <div class="dashboard-header">
                <div>
                    <h2 style="color: var(--gold); font-size: 22px;">Witaj, <span id="user-display-name">Użytkowniku</span></h2>
                    <span id="dash-device-badge" class="device-badge">Komputer</span>
                </div>
                <button onclick="logout()" class="back-btn" style="width: auto;">Wyloguj</button>
            </div>

            <h3 class="section-title">Wybierz Czat</h3>
            <div id="rooms-grid" class="rooms-grid">
                <!-- Pokoje ładowane dynamicznie -->
            </div>

            <!-- Tworzenie propozycji na boisko -->
            <div class="proposal-creator">
                <h3>Stwórz nową propozycję / harmonogram</h3>
                <div class="admin-row">
                    <input type="text" id="new-proposal-title" placeholder="np. Mecz na boisku dziś o 18:00" style="flex:1;">
                    <button onclick="createProposal()" style="width:auto; padding:8px 16px;">Opublikuj</button>
                </div>
            </div>

            <!-- Panel tylko dla administratora -->
            <div id="admin-panel" class="admin-panel" style="display:none;">
                <h3>Panel Administratora</h3>
                <div class="admin-row">
                    <input type="text" id="new-user-name" placeholder="Nazwa nowego użytkownika">
                    <input type="text" id="new-user-pass" placeholder="Tymczasowe hasło">
                    <button onclick="createAccount()">Stwórz konto</button>
                </div>
                <div class="admin-row">
                    <input type="text" id="new-room-name" placeholder="Nazwa nowego czatu">
                    <button onclick="createRoom()">Stwórz pokój</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. WIDOK KONKRETNEGO CZATU -->
    <div id="chat-view" class="view">
        <div class="chat-container">
            <div class="chat-header">
                <h3 id="current-room-title" style="color: var(--gold);">Nazwa czatu</h3>
                <button class="back-btn" onclick="switchView('dashboard-view')">Wróć do menu</button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <!-- Wiadomości -->
            </div>
            <div class="chat-input-bar">
                <input type="text" id="message-input" placeholder="Napisz wiadomość..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Wyślij</button>
            </div>
        </div>
    </div>

    <script>
        // Konfiguracja Supabase (Wklej swoje dane)
        const SUPABASE_URL = 'https://rlgjbvocrgeyhrrmxoan.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsZ2pidm9jcmdleWhycm14b2FuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MTg2NTMsImV4cCI6MjEwOTk5NDY1M30.HwE2ClWIqbA_aNSUuqhrvRZKbC6uHQ-cNgp3_Aso1v4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentRoomId = null;
        let activeSubscription = null;

        // Wykrywanie typu urządzenia
        function detectDeviceType() {
            const ua = navigator.userAgent;
            let device = 'Komputer';
            if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
                device = 'Tablet';
            } else if (/Mobile|iP(hone|od)|Android|BlackBerry|IEMobile|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/i.test(ua)) {
                device = 'Telefon';
            }

            document.body.className = `device-${device.toLowerCase()}`;
            
            const badge1 = document.getElementById('login-device-badge');
            const badge2 = document.getElementById('dash-device-badge');
            if (badge1) badge1.textContent = `Urządzenie: ${device}`;
            if (badge2) badge2.textContent = `Urządzenie: ${device}`;
            
            return device;
        }

        // Uruchomienie wykrywania przy załadowaniu strony
        window.addEventListener('DOMContentLoaded', () => {
            detectDeviceType();
        });

        // Przełączanie widoków
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (viewId !== 'chat-view' && activeSubscription) {
                supabaseClient.removeChannel(activeSubscription);
            }
        }

        // Logowanie
        async function handleLogin() {
            const login = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if (!login || !pass) return alert('Wypełnij wszystkie pola');

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('username', login)
                .eq('password', pass)
                .single();

            if (error || !data) {
                alert('Błędny login lub hasło!');
                return;
            }

            currentUser = data;
            document.getElementById('user-display-name').textContent = currentUser.username;
            loadDashboard();
            switchView('dashboard-view');
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            switchView('login-view');
        }

        async function loadDashboard() {
            if (currentUser.is_admin) {
                document.getElementById('admin-panel').style.display = 'block';
            }

            // Załaduj pokoje czatów
            const { data: rooms } = await supabaseClient.from('rooms').select('*');
            const grid = document.getElementById('rooms-grid');
            grid.innerHTML = '';
            
            if (rooms) {
                rooms.forEach(room => {
                    grid.innerHTML += `
                        <div class="room-card" onclick="openRoom('${room.id}', '${room.name}')">
                            <h3># ${room.name}</h3>
                            <p>Kliknij, aby wejść</p>
                        </div>
                    `;
                });
            }

            loadActiveProposal();
        }

        // Admin: Tworzenie konta
        async function createAccount() {
            const username = document.getElementById('new-user-name').value.trim();
            const password = document.getElementById('new-user-pass').value.trim();
            if (!username || !password) return alert('Uzupełnij dane');

            const { error } = await supabaseClient.from('users').insert([{ username, password, is_admin: false }]);
            if (error) alert('Błąd: ' + error.message);
            else {
                alert('Utworzono konto pomyślnie!');
                document.getElementById('new-user-name').value = '';
                document.getElementById('new-user-pass').value = '';
            }
        }

        // Admin/Użytkownik: Tworzenie pokoju
        async function createRoom() {
            const name = document.getElementById('new-room-name').value.trim();
            if (!name) return alert('Podaj nazwę pokoju');

            const { error } = await supabaseClient.from('rooms').insert([{ name }]);
            if (error) alert('Błąd: ' + error.message);
            else {
                alert('Utworzono pokój!');
                document.getElementById('new-room-name').value = '';
                loadDashboard();
            }
        }

        // Tworzenie propozycji na boisko
        async function createProposal() {
            const title = document.getElementById('new-proposal-title').value.trim();
            if (!title) return alert('Wpisz treść propozycji');

            const { error } = await supabaseClient.from('proposals').insert([{
                title: title,
                created_by: currentUser.username,
                responses: {}
            }]);

            if (error) alert('Błąd: ' + error.message);
            else {
                alert('Opublikowano propozycję!');
                document.getElementById('new-proposal-title').value = '';
                loadActiveProposal();
            }
        }

        // Ładowanie i obsługa propozycji na górze
        async function loadActiveProposal() {
            const { data } = await supabaseClient.from('proposals').select('*').order('created_at', { ascending: false }).limit(1);
            const bar = document.getElementById('proposal-bar');
            
            if (data && data.length > 0) {
                const prop = data[0];
                document.getElementById('proposal-title').textContent = prop.title;
                document.getElementById('proposal-author').textContent = prop.created_by;
                
                // Podsumowanie odpowiedzi
                let summaryText = 'Odpowiedzi: ';
                const responses = prop.responses || {};
                const entries = Object.entries(responses);
                if (entries.length === 0) {
                    summaryText += 'brak';
                } else {
                    summaryText += entries.map(([user, info]) => `${user}: ${info.status}${info.time !== 'Standardowa' ? ' ('+info.time+')' : ''}`).join(' | ');
                }
                document.getElementById('proposal-summary').textContent = summaryText;
                bar.style.display = 'flex';
            } else {
                bar.style.display = 'none';
            }
        }

        async function respondProposal(status, customTime = 'Standardowa') {
            const { data } = await supabaseClient.from('proposals').select('*').order('created_at', { ascending: false }).limit(1);
            if (!data || data.length === 0) return;
            const prop = data[0];

            let responses = prop.responses || {};
            responses[currentUser.username] = {
                status: status,
                time: customTime
            };

            const { error } = await supabaseClient
                .from('proposals')
                .update({ responses: responses })
                .eq('id', prop.id);

            if (error) {
                alert('Błąd zapisu: ' + error.message);
            } else {
                alert('Zapisano odpowiedź: ' + status + (customTime !== 'Standardowa' ? ' ('+customTime+')' : ''));
                loadActiveProposal();
            }
        }

        function openTimePrompt() {
            const time = prompt("Wpisz godzinę, o której przyjdziesz (np. 17:30):");
            if (time) {
                respondProposal('Będę o innej godzinie', time);
            }
        }

        // Obsługa czatu
        function openRoom(roomId, roomName) {
            currentRoomId = roomId;
            document.getElementById('current-room-title').textContent = '#' + roomName;
            switchView('chat-view');
            loadMessages();
            subscribeToMessages();
        }

        async function loadMessages() {
            const container = document.getElementById('chat-messages');
            const { data: messages } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('room_id', currentRoomId)
                .order('created_at', { ascending: true });

            container.innerHTML = '';
            if (messages) {
                messages.forEach(msg => appendMessageUI(msg));
            }
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageUI(msg) {
            const container = document.getElementById('chat-messages');
            const isMine = msg.sender === currentUser.username;
            
            container.innerHTML += `
                <div class="message ${isMine ? 'mine' : ''}">
                    <div class="sender">${escapeHtml(msg.sender)}</div>
                    <div class="text">${escapeHtml(msg.content)}</div>
                    <div class="meta">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function subscribeToMessages() {
            activeSubscription = supabaseClient.channel('room-' + currentRoomId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${currentRoomId}` }, payload => {
                    appendMessageUI(payload.new);
                })
                .subscribe();
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            await supabaseClient.from('messages').insert([{
                room_id: currentRoomId,
                sender: currentUser.username,
                content: text
            }]);

            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
