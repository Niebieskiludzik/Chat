<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub - Logowanie</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>PRIVATE HUB</h2>
            <div style="text-align: center;">
                <div id="login-device-badge" class="device-badge">Urządzenie</div>
            </div>
            <div class="input-group">
                <label>Login</label>
                <input type="text" id="login-username" placeholder="Wpisz swój login" onkeypress="handleLoginKeyPress(event)">
            </div>
            <div class="input-group">
                <label>Hasło</label>
                <input type="password" id="login-password" placeholder="Wpisz hasło" onkeypress="handleLoginKeyPress(event)">
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', this)">👁️</button>
            </div>
            <button onclick="handleLogin()">Zaloguj się</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.getElementById('login-device-badge').textContent = `Urządzenie: ${detectDeviceType()}`;

        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function handleLoginKeyPress(e) {
            if (e.key === 'Enter') handleLogin();
        }

        async function handleLogin() {
            const login = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if (!login || !pass) {
                showToast('Wypełnij wszystkie pola');
                return;
            }

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('username', login)
                .eq('password', pass)
                .single();

            if (error || !data) {
                showToast('Błędny login lub hasło!');
                return;
            }

            setCurrentUser(data);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
