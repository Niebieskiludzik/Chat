<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub - Menu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <span class="device-badge" id="dash-device-badge" style="margin:0;">PC</span>
        </div>
        <div class="nav-center">
            <div class="avatar" id="nav-user-avatar">U</div>
            <div>
                <div class="nav-title" id="user-display-name">Użytkowniku</div>
                <div class="nav-subtitle" id="user-status-sub">Dostępny</div>
            </div>
        </div>
        <div class="nav-right" style="justify-content: flex-end;">
            <button class="nav-btn" onclick="openSettings()">⚙️ Ustawienia</button>
        </div>
    </header>

    <div class="dashboard-container">
        <h3 class="section-title">
            <span>Twoje Czaty</span>
            <button class="nav-btn" onclick="openCreateRoomModal()" style="padding: 6px 12px; font-size: 13px;">+ Nowy Czat</button>
        </h3>
        <div id="rooms-grid" class="rooms-grid">
            <!-- Pokoje ładowane dynamicznie -->
        </div>

        <div id="admin-panel" class="admin-panel" style="display:none;">
            <h3>Panel Administratora Głównego</h3>
            <div class="admin-row">
                <input type="text" id="new-user-name" placeholder="Nowy login">
                <input type="text" id="new-user-pass" placeholder="Tymczasowe hasło">
                <button onclick="createAccount()">Stwórz konto</button>
            </div>
        </div>
    </div>

    <!-- Modal Ustawień Konta -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3>Personalizacja Konta</h3>
            <div class="avatar-preview" id="modal-avatar-preview">U</div>
            
            <div class="input-group">
                <label>Zdjęcie profilowe</label>
                <input type="file" id="avatar-file-input" accept="image/*" onchange="previewAndCompressImage(event)" style="color: var(--text-main);">
            </div>
            <div class="input-group">
                <label>Wyświetlana nazwa</label>
                <input type="text" id="setting-display-name" placeholder="Twoja nazwa publiczna">
            </div>
            <div class="input-group">
                <label>Status / Opis (Bio)</label>
                <input type="text" id="setting-bio" placeholder="Co u Ciebie słychać?">
            </div>
            <div class="input-group">
                <label>Motyw kolorystyczny</label>
                <select id="setting-theme">
                    <option value="gold">Złoty</option>
                    <option value="emerald">Szmaragdowy</option>
                    <option value="crimson">Krwisty</option>
                </select>
            </div>
            <div class="input-group">
                <label>Tryb wyświetlania</label>
                <select id="setting-mode">
                    <option value="dark">Ciemny</option>
                    <option value="light">Jasny</option>
                </select>
            </div>
            <div style="margin-bottom: 15px; text-align: center;">
                <span class="glory-badge" id="modal-glory-badge">🏆 Punkty Chwały: 0</span>
            </div>

            <button onclick="saveSettings()" style="margin-bottom: 10px;">Zapisz zmiany</button>
            <button class="btn-decline" onclick="logout()" style="width:100%; padding:12px; border-radius:6px; border:none; font-weight:bold; cursor:pointer;">Wyloguj się</button>
            <button onclick="closeSettings()" style="background:transparent; color:var(--text-muted); margin-top:10px; border:none; cursor:pointer; width:100%;">Zamknij</button>
        </div>
    </div>

    <!-- Modal Tworzenia Pokoju -->
    <div id="create-room-modal" class="modal">
        <div class="modal-content">
            <h3>Stwórz nowy czat</h3>
            <div class="input-group">
                <label>Nazwa pokoju</label>
                <input type="text" id="modal-room-name" placeholder="np. Ekipa z boiska">
            </div>
            <button onclick="createRoom()">Utwórz</button>
            <button onclick="closeCreateRoomModal()" style="background:transparent; color:var(--text-muted); margin-top:10px; border:none; cursor:pointer; width:100%;">Anuluj</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const currentUser = getCurrentUser();
        let compressedAvatarBase64 = null;

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            updateUserHeaderInfo();
            if (currentUser.is_admin) {
                document.getElementById('admin-panel').style.display = 'block';
            }
            loadDashboardRooms();
        }

        function updateUserHeaderInfo() {
            document.getElementById('user-display-name').textContent = currentUser.display_name || currentUser.username;
            document.getElementById('user-status-sub').textContent = currentUser.bio || 'Dostępny';
            document.getElementById('dash-device-badge').textContent = detectDeviceType();
            
            const avatarEl = document.getElementById('nav-user-avatar');
            if (currentUser.avatar) {
                avatarEl.innerHTML = `<img src="${currentUser.avatar}" alt="Avatar">`;
            } else {
                avatarEl.textContent = currentUser.username.charAt(0).toUpperCase();
            }
        }

        async function loadDashboardRooms() {
            const { data: memberships, error } = await supabaseClient
                .from('room_members')
                .select('room_id')
                .eq('user_id', currentUser.id);

            if (error) {
                console.error("Błąd ładowania członkostwa:", error);
                return;
            }

            const roomIds = memberships ? memberships.map(m => m.room_id) : [];
            if (roomIds.length === 0) {
                document.getElementById('rooms-grid').innerHTML = `<p style="color:var(--text-muted);">Brak dostępnych czatów.</p>`;
                return;
            }

            const { data: rooms } = await supabaseClient
                .from('rooms')
                .select('*')
                .in('id', roomIds);

            const grid = document.getElementById('rooms-grid');
            grid.innerHTML = '';
            
            if (rooms) {
                rooms.forEach(room => {
                    const firstLetter = room.name.charAt(0).toUpperCase();
                    grid.innerHTML += `
                        <div class="room-card" onclick="openRoom('${room.id}', '${room.name}')">
                            <div class="room-info">
                                <div class="avatar">${firstLetter}</div>
                                <div>
                                    <h3># ${room.name}</h3>
                                    <p>Kliknij, aby otworzyć</p>
                                </div>
                            </div>
                            <span>➔</span>
                        </div>
                    `;
                });
            }
        }

        function openRoom(roomId, roomName) {
            localStorage.setItem('current_room_id', roomId);
            localStorage.setItem('current_room_name', roomName);
            window.location.href = 'chat.html';
        }

        function openSettings() {
            compressedAvatarBase64 = currentUser.avatar || null;
            const preview = document.getElementById('modal-avatar-preview');
            if (compressedAvatarBase64) {
                preview.innerHTML = `<img src="${compressedAvatarBase64}" alt="Preview">`;
            } else {
                preview.textContent = currentUser.username.charAt(0).toUpperCase();
            }

            document.getElementById('setting-display-name').value = currentUser.display_name || '';
            document.getElementById('setting-bio').value = currentUser.bio || '';
            document.getElementById('setting-theme').value = currentUser.preferred_theme || 'gold';
            document.getElementById('setting-mode').value = currentUser.theme_mode || 'dark';
            document.getElementById('modal-glory-badge').textContent = `🏆 Punkty Chwały: ${currentUser.glory_points || 0}`;

            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function openCreateRoomModal() {
            document.getElementById('create-room-modal').classList.add('active');
        }
        function closeCreateRoomModal() {
            document.getElementById('create-room-modal').classList.remove('active');
        }

        function previewAndCompressImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 120;
                    const MAX_HEIGHT = 120;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedAvatarBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('modal-avatar-preview').innerHTML = `<img src="${compressedAvatarBase64}" alt="Preview">`;
                }
            }
        }

        async function saveSettings() {
            const updateData = {
                display_name: document.getElementById('setting-display-name').value.trim(),
                bio: document.getElementById('setting-bio').value.trim(),
                preferred_theme: document.getElementById('setting-theme').value,
                theme_mode: document.getElementById('setting-mode').value
            };
            if (compressedAvatarBase64 !== null) {
                updateData.avatar = compressedAvatarBase64;
            }
            
            const { error } = await supabaseClient
                .from('users')
                .update(updateData)
                .eq('id', currentUser.id);

            if (error) {
                alert('Błąd zapisu: ' + error.message);
            } else {
                Object.assign(currentUser, updateData);
                setCurrentUser(currentUser);
                alert('Zapisano ustawienia!');
                closeSettings();
                location.reload();
            }
        }

        async function createAccount() {
            const username = document.getElementById('new-user-name').value.trim();
            const password = document.getElementById('new-user-pass').value.trim();
            if (!username || !password) return alert('Uzupełnij dane');

            const { data, error } = await supabaseClient.from('users').insert([{ username, password, is_admin: false }]).select();
            if (error) {
                alert('Błąd: ' + error.message);
            } else {
                if (data && data.length > 0) {
                    await supabaseClient.from('room_members').insert([{ room_id: 1, user_id: data[0].id, is_admin: false }]);
                }
                alert('Utworzono konto pomyślnie!');
                document.getElementById('new-user-name').value = '';
                document.getElementById('new-user-pass').value = '';
            }
        }

        async function createRoom() {
            const name = document.getElementById('modal-room-name').value.trim();
            if (!name) return alert('Podaj nazwę');

            // 1. Stwórz pokój
            const { data, error } = await supabaseClient.from('rooms').insert([{ name }]).select();
            if (error) {
                alert('Błąd: ' + error.message);
            } else if (data && data.length > 0) {
                const newRoomId = data[0].id;
                // 2. Dodaj twórcę jako ADMINA tego pokoju
                await supabaseClient.from('room_members').insert([{ 
                    room_id: newRoomId, 
                    user_id: currentUser.id, 
                    is_admin: true 
                }]);
                alert('Utworzono pokój!');
                closeCreateRoomModal();
                loadDashboardRooms();
            }
        }
    </script>
</body>
</html>
