<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Hub - Menu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <span class="device-badge" id="dash-device-badge" style="margin:0;">PC</span>
        </div>
        <div class="nav-center">
            <div class="avatar" id="nav-user-avatar">U</div>
            <div>
                <div class="nav-title" id="user-display-name">Użytkowniku</div>
                <div class="nav-subtitle">Panel główny</div>
            </div>
        </div>
        <div class="nav-right" style="justify-content: flex-end;">
            <button class="nav-btn" onclick="openSettings()">⚙️ Ustawienia</button>
        </div>
    </header>

    <div class="dashboard-container">
        <h3 class="section-title">Wybierz Czat</h3>
        <div id="rooms-grid" class="rooms-grid">
            <!-- Pokoje ładowane dynamicznie -->
        </div>

        <!-- Panel Admina -->
        <div id="admin-panel" class="admin-panel" style="display:none;">
            <h3>Panel Administratora</h3>
            <div class="admin-row">
                <input type="text" id="new-user-name" placeholder="Nowy login">
                <input type="text" id="new-user-pass" placeholder="Tymczasowe hasło">
                <button onclick="createAccount()">Stwórz konto</button>
            </div>
            <div class="admin-row">
                <input type="text" id="new-room-name" placeholder="Nazwa nowego pokoju czatu">
                <button onclick="createRoom()">Stwórz pokój</button>
            </div>
        </div>
    </div>

    <!-- Modal Ustawień i Avatarów -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3>Ustawienia konta</h3>
            <div class="avatar-preview" id="modal-avatar-preview">U</div>
            
            <div class="input-group" style="text-align: left;">
                <label>Wybierz zdjęcie profilowe (zmniejszy się automatycznie)</label>
                <input type="file" id="avatar-file-input" accept="image/*" onchange="previewAndCompressImage(event)" style="color: var(--text-main);">
            </div>

            <button onclick="saveSettings()" style="margin-bottom: 10px;">Zapisz zmiany</button>
            <button class="btn-decline" onclick="logout()" style="width:100%; padding:12px; border-radius:6px; border:none; font-weight:bold; cursor:pointer;">Wyloguj się</button>
            <button onclick="closeSettings()" style="background:transparent; color:var(--text-muted); margin-top:10px; border:none; cursor:pointer;">Zamknij</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const currentUser = getCurrentUser();
        let compressedAvatarBase64 = null;

        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('user-display-name').textContent = currentUser.username;
            document.getElementById('dash-device-badge').textContent = detectDeviceType();
            
            updateAvatarUI(currentUser.avatar, currentUser.username);

            if (currentUser.is_admin) {
                document.getElementById('admin-panel').style.display = 'block';
            }
            loadDashboard();
        }

        function updateAvatarUI(avatarData, username) {
            const avatarEl = document.getElementById('nav-user-avatar');
            if (avatarData) {
                avatarEl.innerHTML = `<img src="${avatarData}" alt="Avatar">`;
            } else {
                avatarEl.textContent = username.charAt(0).toUpperCase();
            }
        }

        async function loadDashboard() {
            const { data: rooms } = await supabaseClient.from('rooms').select('*');
            const grid = document.getElementById('rooms-grid');
            grid.innerHTML = '';
            
            if (rooms) {
                rooms.forEach(room => {
                    const firstLetter = room.name.charAt(0).toUpperCase();
                    grid.innerHTML += `
                        <div class="room-card" onclick="openRoom('${room.id}', '${room.name}')">
                            <div class="avatar">${firstLetter}</div>
                            <div>
                                <h3># ${room.name}</h3>
                                <p>Kliknij, aby wejść</p>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function openRoom(roomId, roomName) {
            localStorage.setItem('current_room_id', roomId);
            localStorage.setItem('current_room_name', roomName);
            window.location.href = 'chat.html';
        }

        function openSettings() {
            compressedAvatarBase64 = currentUser.avatar || null;
            const preview = document.getElementById('modal-avatar-preview');
            if (compressedAvatarBase64) {
                preview.innerHTML = `<img src="${compressedAvatarBase64}" alt="Preview">`;
            } else {
                preview.textContent = currentUser.username.charAt(0).toUpperCase();
            }
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        // Funkcja automatycznie pomniejszająca i kompresująca obrazek w przeglądarce
        function previewAndCompressImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 120; // maksymalna szerokość avatara
                    const MAX_HEIGHT = 120; // maksymalna wysokość avatara
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Kompresja do formatu JPEG z jakością 70% (bardzo mały rozmiar)
                    compressedAvatarBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    // Podgląd w modalu
                    document.getElementById('modal-avatar-preview').innerHTML = `<img src="${compressedAvatarBase64}" alt="Preview">`;
                }
            }
        }

        async function saveSettings() {
            const updateData = {};
            if (compressedAvatarBase64 !== null) {
                updateData.avatar = compressedAvatarBase64;
            }
            
            const { error } = await supabaseClient
                .from('users')
                .update(updateData)
                .eq('id', currentUser.id);

            if (error) {
                alert('Błąd zapisu ustawień: ' + error.message);
            } else {
                if (compressedAvatarBase64 !== null) currentUser.avatar = compressedAvatarBase64;
                setCurrentUser(currentUser);
                alert('Zapisano ustawienia!');
                closeSettings();
                location.reload();
            }
        }

        async function createAccount() {
            const username = document.getElementById('new-user-name').value.trim();
            const password = document.getElementById('new-user-pass').value.trim();
            if (!username || !password) return alert('Uzupletij dane');

            const { error } = await supabaseClient.from('users').insert([{ username, password, is_admin: false }]);
            if (error) alert('Błąd: ' + error.message);
            else {
                alert('Utworzono konto!');
                document.getElementById('new-user-name').value = '';
                document.getElementById('new-user-pass').value = '';
            }
        }

        async function createRoom() {
            const name = document.getElementById('new-room-name').value.trim();
            if (!name) return alert('Podaj nazwę');

            const { error } = await supabaseClient.from('rooms').insert([{ name }]);
            if (error) alert('Błąd: ' + error.message);
            else {
                alert('Utworzono pokój!');
                document.getElementById('new-room-name').value = '';
                loadDashboard();
            }
        }
    </script>
</body>
</html>
